<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hesa's Lock Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(110, 110, 118, 0.38);
    --text: #fff;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
    color: var(--text);
  }

  .phone {
    position: relative;
    width: min(402px, 100vw);
    aspect-ratio: 402 / 874;
    max-height: 100vh;
    overflow: hidden;
    border-radius: 0;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  @media (min-width: 500px) { .phone { border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,.6); } }

  .wall {
    position: absolute; inset: 0;
    background: #9fb0c2 center / cover no-repeat;
    transition: filter .45s var(--ease), transform .45s var(--ease);
  }
  .phone.passcode .wall { filter: brightness(.72) saturate(.85); }
  .phone.home .wall { filter: none; transform: scale(1.04); }

  /* status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 22px 0 34px; font-weight: 600; font-size: 15px;
  }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .sb-batt {
    position: relative; width: 27px; height: 13px; border-radius: 4.5px;
    background: rgba(255,255,255,.4); overflow: hidden;
    font-size: 10px; font-weight: 700; line-height: 13px; text-align: center; color: #000; text-shadow: none;
  }
  .sb-batt i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .sb-batt.low-power i { background: #ffd60a; }
  .sb-batt span { position: relative; }

  /* screens */
  .screen {
    position: absolute; inset: 0;
    transition: transform .45s var(--ease), opacity .45s var(--ease);
  }
  .screen.dragging { transition: none; }
  #passcodeScreen, #homeScreen { opacity: 0; pointer-events: none; }
  .phone.passcode #passcodeScreen, .phone.home #homeScreen { opacity: 1; pointer-events: auto; }
  .phone.passcode #lockScreen, .phone.home #lockScreen { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  /* lock screen */
  .lock-icon { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); transition: transform .3s var(--ease); }
  .date {
    position: absolute; top: 96px; width: 100%; text-align: center;
    font-size: 21px; font-weight: 600; letter-spacing: .2px;
  }
  .clock {
    position: absolute; top: 118px; width: 100%; text-align: center;
    font-family: "Fraunces", "New York", Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-size: 116px; font-weight: 700; line-height: 1; letter-spacing: 1px;
    color: rgba(240, 244, 246, .82);
    -webkit-text-stroke: 1px rgba(255,255,255,.9);
    text-shadow: 0 2px 4px rgba(0,0,0,.18);
  }

  .notifs {
    position: absolute; left: 14px; right: 14px; bottom: 214px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .notif {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 22px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,.35);
    text-shadow: none;
  }
  .avatar { position: relative; flex: none; width: 40px; height: 40px; }
  .avatar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; pointer-events: none; }
  .avatar .badge {
    position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px;
    border-radius: 5px; background: #25d366; display: grid; place-items: center;
    border: 1.5px solid rgba(255,255,255,.9);
  }
  .notif .body { flex: 1; min-width: 0; }
  .notif .row { display: flex; justify-content: space-between; align-items: baseline; }
  .notif .name { font-weight: 600; font-size: 15px; color: #fff; }
  .notif .when { font-size: 13px; color: rgba(255,255,255,.75); }
  .notif .msg { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [contenteditable] { outline: none; cursor: text; border-radius: 4px; user-select: text; -webkit-user-select: text; }
  [contenteditable]:focus { background: rgba(255,255,255,.18); text-overflow: clip; }

  .widgets {
    position: absolute; left: 36px; right: 22px; bottom: 140px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .battery-widget { width: 154px; font-size: 16px; font-weight: 600; }
  .battery-widget .top { display: flex; align-items: center; gap: 8px; }
  .battery-widget .device { margin-top: 2px; font-weight: 500; white-space: nowrap; }
  .battery-widget .bar { margin-top: 8px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; }
  .battery-widget .bar span { display: block; height: 100%; background: #fff; border-radius: 4px; }
  .music {
    width: 60px; height: 60px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }

  .btn {
    position: absolute; bottom: 58px; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(16px) brightness(.9); -webkit-backdrop-filter: blur(16px) brightness(.9);
    display: grid; place-items: center; cursor: pointer;
    transition: transform .15s;
  }
  .btn:active { transform: scale(.92); }
  .btn.left { left: 50px; } .btn.right { right: 50px; }
  .focus {
    position: absolute; bottom: 77px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px;
    background: rgba(255,255,255,.1); font-size: 15px; font-weight: 500;
  }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #fff; z-index: 5;
  }
  .swipe-hint {
    position: absolute; bottom: 22px; width: 100%; text-align: center;
    font-size: 13px; color: rgba(255,255,255,.8);
    animation: hint 2.4s ease-in-out infinite;
  }
  @keyframes hint { 0%, 100% { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; transform: none; } }

  /* passcode */
  #passcodeScreen { transform: translateY(40px); }
  .phone.passcode #passcodeScreen { transform: none; }
  .pc-title { position: absolute; top: 166px; width: 100%; text-align: center; font-size: 21px; font-weight: 500; }
  .dots { position: absolute; top: 208px; left: 0; right: 0; display: flex; justify-content: center; gap: 23px; }
  .dots i {
    width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff;
    transition: background .1s;
  }
  .dots i.on { background: #fff; }
  .dots.shake { animation: shake .45s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-18px); } 30% { transform: translateX(15px); }
    45% { transform: translateX(-11px); } 60% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  .keypad {
    position: absolute; top: 318px; left: 0; right: 0;
    display: grid; grid-template-columns: repeat(3, 82px); gap: 15px 30px; justify-content: center;
  }
  .key {
    width: 82px; height: 82px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font: inherit; cursor: pointer;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.45);
    backdrop-filter: blur(6px) saturate(140%); -webkit-backdrop-filter: blur(6px) saturate(140%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.08);
    transition: background .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .key.pressed { background: rgba(255,255,255,.5); transition: none; }
  .key b { font-size: 38px; font-weight: 400; line-height: 1; }
  .key small { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; margin-top: 2px; min-height: 12px; }
  .key.zero { grid-column: 2; }
  .pc-link {
    position: absolute; bottom: 48px; background: none; border: 0; color: #fff;
    font: inherit; font-size: 17px; cursor: pointer; text-shadow: inherit;
  }
  .pc-link.left { left: 40px; width: 100px; } .pc-link.right { right: 40px; width: 100px; }

  /* home (unlocked) */
  .sb-time { display: none; align-items: center; gap: 4px; }
  .phone.home #carrier { display: none; }
  .phone.home .sb-time { display: flex; }

  #homeScreen { transform: scale(1.12); }
  .phone.home #homeScreen { transform: none; transition-delay: .05s; }
  .hs-widget {
    position: absolute; top: 68px; width: 160px; height: 160px; border-radius: 36px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  .hs-widget.clockw { left: 29px; background: #fff; }
  .hs-widget.weather {
    left: 213px; padding: 18px 17px; text-shadow: none;
    background: linear-gradient(#2c3747, #1c2330);
  }
  .weather .city { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .weather .temp { font-size: 46px; font-weight: 300; line-height: 1.05; }
  .weather .cond { position: absolute; left: 17px; bottom: 16px; font-size: 13px; font-weight: 500; line-height: 1.3; }
  .hs-label { position: absolute; top: 236px; width: 160px; text-align: center; font-size: 12px; font-weight: 500; }

  .apps {
    position: absolute; top: 266px; left: 32px; right: 32px;
    display: grid; grid-template-columns: repeat(4, 62px); justify-content: space-between; row-gap: 38px;
  }
  .app { position: relative; width: 62px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .app .icon {
    width: 62px; height: 62px; border-radius: 15px; overflow: hidden; position: relative;
    display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.12);
    transition: transform .12s, filter .12s;
  }
  .app:active .icon { transform: scale(.92); filter: brightness(.85); }
  .app .label {
    position: absolute; top: 66px; left: -14px; right: -14px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .app .badge-n {
    position: absolute; top: -8px; right: -8px; min-width: 25px; height: 25px; padding: 0 7px; border-radius: 13px;
    background: #ff3b30; color: #fff; font-size: 15px; font-weight: 500; line-height: 25px; text-shadow: none;
  }
  .cal { background: #fff; color: #222; text-shadow: none; display: flex !important; flex-direction: column; justify-content: center; }
  .cal .wd { color: #f2493d; font-size: 11px; font-weight: 600; line-height: 1; }
  .cal .d { font-size: 34px; font-weight: 300; line-height: 1; margin-top: 2px; }

  .search {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 16px;
    background: rgba(120,120,128,.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 13px; font-weight: 500; color: rgba(255,255,255,.9);
  }
  .dock {
    position: absolute; left: 14px; right: 14px; bottom: 16px; height: 100px; border-radius: 36px;
    padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.4);
    backdrop-filter: blur(10px) saturate(150%); -webkit-backdrop-filter: blur(10px) saturate(150%);
  }

  /* app layer: opens on top of the home screen when an app is tapped */
  .app-layer {
    position: absolute; inset: 0; z-index: 4; overflow: auto;
    background: #fff; color: #000; text-shadow: none;
    transform: scale(.15); opacity: 0; pointer-events: none;
    border-radius: 40px;
    transition: transform .42s var(--ease), opacity .3s var(--ease), border-radius .42s var(--ease);
  }
  .app-layer.dragging { transition: none; }
  .phone.app-open .app-layer { transform: none; opacity: 1; pointer-events: auto; border-radius: 0; }
  .app-placeholder {
    min-height: 100%; padding: 54px 24px 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-size: 15px; color: #8e8e93; text-align: center;
  }
  .app-placeholder .app { transform: scale(1.3); margin-bottom: 10px; cursor: default; }
  .app-placeholder b { font-size: 20px; color: #000; }
  .app-closer { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; z-index: 6; display: none; cursor: grab; }
  .phone.app-open .app-closer { display: block; }
  .phone.app-open .home-bar { transition: background .3s; }
  .phone.app-open.dark-status .status { color: #000; text-shadow: none; }
  .phone.app-open.dark-status .status svg { filter: invert(1); }
  .phone.app-open.dark-status .sb-batt { background: rgba(0,0,0,.25); color: #fff; }
  .phone.app-open.dark-status .sb-batt:not(.low-power) i { background: #000; }
  .phone.app-open.dark-status .home-bar { background: #000; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="wall" id="wall"></div>

  <div class="status">
    <span id="carrier"></span>
    <span class="sb-time"><span id="sbTime"></span><svg width="16" height="14" viewBox="0 0 24 22" fill="#fff"><path d="M12 21.5 10.3 20C4.2 14.5 0 10.8 0 6.3A6.2 6.2 0 0 1 6.3 0 6.8 6.8 0 0 1 12 2.9 6.8 6.8 0 0 1 17.7 0 6.2 6.2 0 0 1 24 6.3c0 4.5-4.2 8.2-10.3 13.7Z"/></svg></span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" fill-opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.1 3.6l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2a7 7 0 0 0-10 0l1.2 1.2c1-.9 2.3-1.5 3.8-1.5Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6Z"/></svg>
      <span class="sb-batt" id="sbBatt"><i id="sbBattFill"></i><span id="sbBattNum"></span></span>
    </span>
  </div>

  <!-- 1. Lock screen: swipe up -->
  <section class="screen" id="lockScreen">
    <svg class="lock-icon" id="lockIcon" width="20" height="26" viewBox="0 0 20 26"><path d="M5 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#fff" stroke-width="2.6"/><rect x="1" y="11" width="18" height="14" rx="3" fill="#fff"/></svg>
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <div class="notifs" id="notifs"></div>

    <div class="widgets">
      <div class="battery-widget">
        <div class="top">
          <svg width="12" height="20" viewBox="0 0 12 20"><rect x="1" y="2" width="10" height="17" rx="2.5" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="4" y="0" width="4" height="2" rx=".8" fill="#fff"/></svg>
          <span id="battPct"></span>
        </div>
        <div class="device" id="device"></div>
        <div class="bar"><span id="battBar"></span></div>
      </div>
      <div class="music" aria-label="Music">
        <svg width="40" height="40" viewBox="0 0 40 40"><g fill="none" stroke="#111" stroke-linecap="round"><path d="M7 14c9-3 18-2.5 26 1.5" stroke-width="4"/><path d="M8.5 21c7.5-2.3 15-1.8 21.5 1.3" stroke-width="3.3"/><path d="M10 27.5c6-1.7 11.8-1.3 17 1" stroke-width="2.7"/></g></svg>
      </div>
    </div>

    <div class="btn left" aria-label="Flashlight">
      <svg width="20" height="30" viewBox="0 0 18 26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M2 2h14v4l-3 4v13a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 5 23V10L2 6Z" fill="#fff"/><circle cx="9" cy="15" r="1.4" fill="#555" stroke="none"/></svg>
    </div>
    <div class="focus" id="focus">
      <svg width="15" height="14" viewBox="0 0 24 22" fill="#fff"><path d="M12 21.5 10.3 20C4.2 14.5 0 10.8 0 6.3A6.2 6.2 0 0 1 6.3 0 6.8 6.8 0 0 1 12 2.9 6.8 6.8 0 0 1 17.7 0 6.2 6.2 0 0 1 24 6.3c0 4.5-4.2 8.2-10.3 13.7Z"/></svg>
      <span id="focusName"></span>
    </div>
    <div class="btn right" aria-label="Camera">
      <svg width="28" height="22" viewBox="0 0 26 20" fill="#fff"><path d="M9 1h8l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4Z"/><circle cx="13" cy="11.5" r="5" fill="#555"/><circle cx="13" cy="11.5" r="3.6" fill="#fff"/></svg>
    </div>
    <div class="swipe-hint">Swipe up to open</div>
  </section>

  <!-- 2. Passcode -->
  <section class="screen" id="passcodeScreen">
    <div class="pc-title">Enter Passcode</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="keypad"></div>
    <button class="pc-link left" type="button">Emergency</button>
    <button class="pc-link right" type="button" id="cancelBtn">Cancel</button>
  </section>

  <!-- 3. Unlocked -->
  <section class="screen" id="homeScreen">
    <div class="hs-widget clockw">
      <svg width="160" height="160" viewBox="0 0 160 160" id="analog">
        <g id="ticks"></g>
        <g font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#111">
          <text x="80" y="47" font-size="21">12</text>
          <text x="80" y="136" font-size="21">6</text>
          <text x="35" y="91" font-size="21">9</text>
          <text x="125" y="91" font-size="21">3</text>
          <text x="80" y="66" font-size="15" fill="#8e8e93" id="awCity"></text>
          <text x="80" y="116" font-size="15" fill="#8e8e93" id="awOffset"></text>
        </g>
        <line id="hHand" x1="80" y1="80" x2="80" y2="52" stroke="#111" stroke-width="5" stroke-linecap="round"/>
        <line id="mHand" x1="80" y1="80" x2="80" y2="28" stroke="#111" stroke-width="5" stroke-linecap="round"/>
        <line id="sHand" x1="80" y1="92" x2="80" y2="22" stroke="#f19a0e" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="80" cy="80" r="4" fill="#f19a0e" stroke="#111" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="hs-label" style="left:29px">Clock</div>

    <div class="hs-widget weather">
      <div class="city"><span id="wCity"></span><svg width="11" height="11" viewBox="0 0 12 12" fill="#fff"><path d="M11.5.5 1 5l4.4 1.6L7 11Z"/></svg></div>
      <div class="temp" id="wTemp"></div>
      <div class="cond">
        <svg width="22" height="20" viewBox="0 0 22 20"><path d="M6 13a5 5 0 0 1 .5-10 6 6 0 0 1 11 2.5A3.8 3.8 0 0 1 17 13Z" fill="#fff"/><path d="M7 15.5 6 18M11 15.5 10 18M15 15.5 14 18" stroke="#5ac8fa" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div id="wCond"></div>
        <div id="wHiLo"></div>
      </div>
    </div>
    <div class="hs-label" style="left:213px">Weather</div>

    <div class="apps" id="apps"></div>

    <div class="search">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="5" cy="5" r="3.8"/><path d="m8 8 3 3" stroke-linecap="round"/></svg>
      Search
    </div>
    <div class="dock" id="dock"></div>
  </section>

  <!-- 4. Opened app (filled from the <template>s below) -->
  <section class="app-layer" id="appLayer"></section>
  <div class="app-closer" id="appCloser"></div>

  <div class="home-bar"></div>
</div>

<!--
  ===== APP SCREENS =====
  To give an app its own screen, add a <template> here whose data-app is the
  app's name exactly as it appears under its icon (e.g. "WhatsApp", "Notes",
  "Phone"). Put any HTML/CSS inside it. Apps without a template show a
  placeholder. The screen starts with a white background and a dark status
  bar; for a dark screen add data-status="light" so the status bar turns white.

  Example (remove the comment marks around it to try it):

  <template data-app="Notes">
    <style>
      .notes { padding: 60px 20px; font-size: 16px; }
      .notes h1 { font-size: 32px; margin-bottom: 12px; }
    </style>
    <div class="notes">
      <h1>Notes</h1>
      <p>Grocery list...</p>
    </div>
  </template>
-->

<!-- WhatsApp: the chat list itself is set in CONFIG.whatsapp below -->
<template data-app="WhatsApp">
  <style>
    .wa { position: relative; height: 100%; display: flex; flex-direction: column; background: #fff; color: #0b141a;
          font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif; }
    .wa-scroll { flex: 1; overflow-y: auto; padding: 54px 0 120px; }
    .wa-top { display: flex; align-items: center; justify-content: space-between; padding: 0 19px; height: 30px; margin-top: 0; }
    .wa-top h1 { font-size: 17px; font-weight: 600; position: absolute; left: 50%; transform: translateX(-50%); }
    .wa-circle { width: 43px; height: 43px; border-radius: 50%; display: grid; place-items: center; background: #fff;
                 box-shadow: 0 1px 6px rgba(0,0,0,.08); cursor: pointer; }
    .wa-circle.green { background: #1daa61; box-shadow: none; }
    .wa-right { display: flex; gap: 12px; }
    .wa-chips { display: flex; gap: 8px; padding: 25px 19px 10px; }
    .wa-chip { height: 31px; padding: 0 11px; border-radius: 16px; border: 1px solid #d1d7db; background: #fff;
               font: inherit; font-size: 14px; font-weight: 500; color: #54656f; cursor: pointer; display: grid; place-items: center; }
    .wa-chip.on { background: #d9fdd3; border-color: #a8e6a1; color: #15603e; }
    .wa-row { display: flex; align-items: center; gap: 13px; padding: 0 0 0 19px; cursor: pointer; }
    .wa-row:active { background: #f5f6f6; }
    .wa-row .main { flex: 1; min-width: 0; padding: 12px 19px 12px 0; border-bottom: 1px solid #e9edef; min-height: 72px;
                    display: flex; flex-direction: column; justify-content: center; }
    .wa-row:last-child .main { border-bottom-color: #e9edef; }
    .wa-archived { height: 54px; }
    .wa-archived .ico { width: 54px; display: grid; place-items: center; }
    .wa-archived .main { min-height: 54px; flex-direction: row; align-items: center; justify-content: space-between; color: #54656f; font-weight: 500; font-size: 16px; }
    .wa-archived .count { font-size: 13px; font-weight: 400; }
    .wa-av { width: 54px; height: 54px; border-radius: 50%; flex: none; object-fit: cover; background: #f2ddd1;
             display: grid; place-items: center; overflow: hidden; }
    .wa-av.ring { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #25d366; }
    .wa-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .wa-name { font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-time { font-size: 13px; color: #667781; flex: none; }
    .wa-time.unread { color: #1daa61; font-weight: 500; }
    .wa-prev { font-size: 14.5px; color: #667781; margin-top: 3px; display: flex; align-items: flex-start; gap: 8px; }
    .wa-prev .txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .wa-prev .txt svg { vertical-align: -2px; margin-right: 3px; }
    .wa-prev em { font-style: italic; }
    .wa-badge { flex: none; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 11px; background: #1daa61; color: #fff;
                font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    .wa-e2e { text-align: center; font-size: 12.5px; color: #667781; padding: 22px 30px; }
    .wa-e2e b { color: #1a7f37; font-weight: 500; }
    .wa-empty { text-align: center; color: #667781; font-size: 14px; padding: 40px 20px; }
    .wa-ai { position: absolute; right: 16px; bottom: 112px; width: 44px; height: 44px; border-radius: 50%; background: #fff;
             box-shadow: 0 2px 10px rgba(0,0,0,.12); display: grid; place-items: center; }
    .wa-tabs { position: absolute; left: 20px; right: 20px; bottom: 26px; height: 60px; border-radius: 30px; background: #fff;
               box-shadow: 0 2px 16px rgba(0,0,0,.1); display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
    .wa-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500;
              padding: 6px 8px; border-radius: 24px; cursor: pointer; min-width: 58px; }
    .wa-tab.on { background: #ececec; padding: 6px 14px; }
    .wa-room { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; background: #efeae2;
               transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
    .wa-room.open { transform: none; }
    .wa-head { display: flex; align-items: center; gap: 10px; padding: 48px 19px 10px; position: relative; z-index: 1;
               background: linear-gradient(#f4f6f0, #ecf1e6); box-shadow: 0 1px 0 rgba(0,0,0,.04); }
    .wa-glass { background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9);
                box-shadow: 0 2px 10px rgba(0,0,0,.08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .wa-back { width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer; display: grid; place-items: center; flex: none; }
    .wa-head .wa-av { width: 39px; height: 39px; margin-left: 4px; }
    .wa-head .wa-av svg { transform: scale(.72); }
    .wa-head .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .wa-head .who b { font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-head .who span { font-size: 12px; color: #667781; min-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-head .who span.typing { color: #1daa61; }
    .wa-callpill { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 26px; padding: 0 18px;
                   background: rgba(234,246,222,.85); flex: none; }

    .wa-msgs { flex: 1; overflow-y: auto; padding: 8px 10px 14px; display: flex; flex-direction: column;
               background: #efeae2 center / cover no-repeat; }
    .wa-day { align-self: center; background: rgba(255,255,255,.88); color: #111b21; font-size: 12.5px; font-weight: 600;
              padding: 3px 14px; border-radius: 8px; margin: 14px 0 6px; }
    .wa-msg { max-width: 78%; padding: 7px 11px 7px 12px; border-radius: 18px; font-size: 15.5px; line-height: 1.32;
              position: relative; word-wrap: break-word; white-space: pre-wrap; margin-top: 3px; margin-left: 6px; margin-right: 6px;
              animation: waIn .25s ease-out; }
    .wa-msg.first { margin-top: 10px; }
    .wa-msg.them { align-self: flex-start; background: #fff; }
    .wa-msg.me { align-self: flex-end; background: #dcf9c7; }
    .wa-msg.tail.them { border-bottom-left-radius: 5px; }
    .wa-msg.tail.me { border-bottom-right-radius: 5px; }
    .wa-msg.tail::before { content: ""; position: absolute; bottom: 0; width: 14px; height: 15px; background: inherit;
                           clip-path: path("M6 0 C6 8 4 12.5 0 15 C5 15.6 10 14.6 14 12 L14 0 Z"); }
    .wa-msg.tail.them::before { left: -6px; }
    .wa-msg.tail.me::before { right: -6px; transform: scaleX(-1); }
    .wa-msg .meta { float: right; margin: 8px 0 -5px 12px; font-size: 11px; color: #667781; white-space: nowrap;
                    display: inline-flex; align-items: center; gap: 3px; position: relative; top: 1px; }
    .wa-msg .meta svg path { transition: stroke .3s; }
    .wa-msg .meta.read svg path { stroke: #53bdeb; }
    @keyframes waIn { from { opacity: 0; transform: translateY(8px) scale(.97); } }

    /* reply quote */
    .wa-quote { display: block; margin: -1px -5px 6px -6px; padding: 7px 10px 8px 12px; border-radius: 10px;
                background: rgba(11,20,26,.05); border-left: 4px solid var(--qc); font-size: 13.5px; line-height: 1.3; white-space: normal; }
    .wa-quote b { display: block; color: var(--qc); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
    .wa-quote span { color: #54656f; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .wa-quote.q-me { --qc: #a8682a; }
    .wa-quote.q-them { --qc: #1fa855; }

    .wa-msg.photo, .wa-msg.voice, .wa-msg.call { white-space: normal; }
    .wa-msg.photo .cap { white-space: pre-wrap; }
    /* photo */
    .wa-msg.photo { padding: 4px; }
    .wa-msg.photo img { display: block; width: 236px; max-height: 300px; object-fit: cover; border-radius: 14px; }
    .wa-msg.photo .cap { padding: 6px 8px 3px; }
    .wa-msg.photo .meta.over { position: absolute; right: 12px; top: auto; bottom: 9px; margin: 0; float: none; color: #fff;
                               text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    .wa-msg.photo .meta.over svg path { stroke: #fff; }
    .wa-msg.photo .meta.over.read svg path { stroke: #53bdeb; }

    /* voice note */
    .wa-msg.voice { width: 258px; padding: 8px 11px 6px 8px; }
    .wa-voice { display: flex; align-items: center; gap: 9px; }
    .wa-vplay { width: 30px; height: 30px; border: 0; background: none; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; }
    .wa-wave { position: relative; flex: 1; height: 26px; }
    .wa-wave svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wa-wave .done { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
    .wa-wave .knob { position: absolute; top: 50%; left: var(--p, 0%); width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
                     border-radius: 50%; background: #34b7f1; }
    .wa-msg.me .wa-wave .knob { background: #1daa61; }
    .wa-vav { position: relative; flex: none; }
    .wa-vav .wa-av { width: 44px; height: 44px; }
    .wa-vav .wa-av svg { transform: scale(.75); }
    .wa-vav .mic { position: absolute; left: -5px; bottom: -2px; }
    .wa-vfoot { display: flex; justify-content: space-between; align-items: center; margin: 1px 0 0 39px; font-size: 11px; color: #667781; }
    .wa-vfoot .meta { float: none; margin: 0; top: 0; }

    /* call */
    .wa-msg.call { padding: 9px 11px 7px 9px; min-width: 200px; }
    .wa-call { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .wa-call .ci { width: 38px; height: 38px; border-radius: 50%; background: rgba(11,20,26,.06); display: grid; place-items: center; flex: none; }
    .wa-call .t { display: flex; flex-direction: column; line-height: 1.25; margin-right: 6px; }
    .wa-call .t b { font-size: 15px; font-weight: 500; }
    .wa-call .t span { font-size: 13px; color: #667781; }
    .wa-msg.call .meta { margin-top: 2px; }

    /* group rooms */
    .wa-callpill .chev { display: none; margin-left: -20px; }
    .wa-room.group .wa-callpill { padding: 0 14px; gap: 26px; }
    .wa-room.group .wa-callpill .phone-ic { display: none; }
    .wa-room.group .wa-callpill .chev { display: block; }
    .wa-room.group .wa-msg.them { margin-left: 44px; }
    .wa-sender { display: block; font-size: 14px; font-weight: 500; margin-bottom: 1px; white-space: nowrap; }
    .wa-msg.photo .wa-sender, .wa-msg.doc .wa-sender { padding: 3px 8px 4px; }
    .wa-gav { position: absolute; left: -44px; bottom: 0; }
    .wa-gav .wa-av { width: 30px; height: 30px; font-size: 13px; font-weight: 500; color: #fff; }
    .wa-gav .wa-av svg { transform: scale(.55); }

    /* deleted */
    .wa-del { color: #667781; font-style: italic; }
    .wa-del svg { vertical-align: -2px; margin-right: 3px; }

    /* document */
    .wa-msg.doc { padding: 4px; width: 290px; white-space: normal; }
    .wa-msg.doc .pv { display: block; width: 100%; height: 120px; object-fit: cover; object-position: top; border-radius: 13px 13px 0 0; }
    .wa-docrow { display: flex; align-items: center; gap: 10px; padding: 10px 10px 11px; background: rgba(11,20,26,.04); border-radius: 13px; }
    .wa-msg.doc .pv + .wa-docrow { border-radius: 0 0 13px 13px; }
    .wa-docrow .ext { flex: none; width: 30px; height: 36px; border-radius: 4px; background: #e2343f; color: #fff;
                      font-size: 10px; font-weight: 700; display: grid; place-items: center; }
    .wa-docrow .t { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
    .wa-docrow .t b { font-size: 15px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-docrow .t span { font-size: 12px; color: #667781; }
    .wa-msg.doc > .meta { margin: 4px 6px 0 0; }

    /* share button beside photos and documents */
    .wa-fwd { position: absolute; top: 50%; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%;
              background: rgba(170,170,170,.55); display: grid; place-items: center; }
    .wa-msg.me .wa-fwd { left: -44px; }
    .wa-msg.them .wa-fwd { right: -44px; }

    .wa-bottom { background: #f2f1ee; }
    .wa-inputbar { display: flex; align-items: center; gap: 13px; padding: 9px 12px 9px 14px; }
    .wa-room:not(.kb) .wa-inputbar { padding-bottom: 34px; }
    .wa-input { flex: 1; min-height: 36px; max-height: 96px; overflow-y: auto; border-radius: 18px; background: #fff;
                padding: 8px 36px 8px 13px; font-size: 15.5px; line-height: 1.3;
                position: relative; cursor: text; word-wrap: break-word; box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
    #waTyped { white-space: pre-wrap; }
    .wa-sticker { position: absolute; right: 9px; bottom: 8px; }
    .wa-caret { display: none; width: 2px; height: 19px; background: #1daa61; vertical-align: -4px; margin-left: 1px;
                animation: waBlink 1s steps(1) infinite; }
    .wa-room.kb .wa-caret { display: inline-block; }
    @keyframes waBlink { 50% { opacity: 0; } }
    .wa-send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #4f9a2c; cursor: pointer;
               display: grid; place-items: center; flex: none; }
    .wa-send .arrow, .wa-room.has-text .wa-send .mic, .wa-room.has-text .wa-cam, .wa-room.has-text .wa-sticker { display: none; }
    .wa-room.has-text .wa-send .arrow { display: block; }
    .wa-room.has-text .wa-send { background: #1daa61; }
    .wa-kb { height: 0; overflow: hidden; background: #d1d3d9; transition: height .3s cubic-bezier(.2,.8,.2,1); }
    .wa-room.kb .wa-kb { height: 262px; }
    .wa-kb .rows { padding: 8px 3px 0; display: flex; flex-direction: column; gap: 11px; }
    .wa-kb .row { display: flex; justify-content: center; gap: 6px; }
    .wa-key { flex: 0 0 34px; height: 43px; border-radius: 6px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3);
              display: grid; place-items: center; font-size: 22px; color: #000; transition: background .08s, transform .08s; }
    .wa-key.fn { background: #abb0ba; font-size: 15px; flex-basis: 43px; }
    .wa-key.space { flex: 1 1 auto; font-size: 15px; }
    .wa-key.ret { flex-basis: 88px; font-size: 15px; }
    .wa-key.down { background: #abb0ba; transform: translateY(-2px) scale(1.08); }
    .wa-key.fn.down, .wa-key.space.down, .wa-key.ret.down { transform: none; background: #8d929c; }
    .wa-kb .bar { display: flex; justify-content: space-between; padding: 10px 26px 0; }
    .wa-you { width: 26px; height: 26px; border-radius: 50%; background: #f2ddd1; border: 1.5px solid #c98a72; display: grid; place-items: center; }
  </style>

    return `<div class="app" data-app="${name}">
      <div class="icon ${ic.cls || ""}" style="background:${ic.bg || ""}">${ic.html || ic.svg}</div>
      ${badge ? `<span class="badge-n">${badge}</span>` : ""}
      ${label ? `<div class="label">${name}</div>` : ""}
    </div>`;
  };
  $("apps").innerHTML = ["Calendar", "Photos", "Camera", "Mail", "Notes", "Health", "Settings", "WhatsApp", "X", "Spotify"].map(n => appHTML(n)).join("");
  $("dock").innerHTML = ["Phone", "Safari", "Messages", "FaceTime"].map(n => appHTML(n, false)).join("");

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    const hhmm = `${pad(d.getHours())}.${pad(d.getMinutes())}`;
    $("clock").textContent = CONFIG.time ?? hhmm;
    $("sbTime").textContent = CONFIG.time ?? hhmm;
    $("date").textContent = CONFIG.date ??
      d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).replace(",", "");
    $("calWd").textContent = d.toLocaleDateString("en-GB", { weekday: "short" });
    $("calD").textContent = d.getDate();

    // world clock: time in CONFIG.worldClock.timeZone, and its offset from here
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
      timeZone: CONFIG.worldClock.timeZone, hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23",
    }).formatToParts(d).map(p => [p.type, +p.value]));
    let off = Math.round(((parts.hour * 60 + parts.minute) - (d.getHours() * 60 + d.getMinutes())) / 60);
    if (off > 12) off -= 24; else if (off < -12) off += 24;
    $("awOffset").textContent = off === 0 ? "" : (off > 0 ? `+${off}` : `${off}`);
    const s = parts.second, m = parts.minute + s / 60, h = (parts.hour % 12) + m / 60;
    $("hHand").setAttribute("transform", `rotate(${h * 30} 80 80)`);
    $("mHand").setAttribute("transform", `rotate(${m * 6} 80 80)`);
    $("sHand").setAttribute("transform", `rotate(${s * 6} 80 80)`);
  }
  tick();
  setInterval(tick, 1000);

  // ---- Screens: lock -> passcode -> home ----
  let state = "lock";
  function show(next) {
    state = next;
    phone.classList.toggle("passcode", next === "passcode");
    phone.classList.toggle("home", next === "home");
    if (next !== "passcode") clearCode();
  }

  // Swipe up on the lock screen (or down on the home screen) with mouse or touch.
  const lock = $("lockScreen");
  let drag = null;
  phone.addEventListener("pointerdown", e => {
    if (state === "passcode" || e.target.closest("[contenteditable], .btn, button")) return;
    if (state === "app" && e.target !== $("appCloser")) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, app: e.target.closest(".app") };
    if (state === "app") $("appLayer").classList.add("dragging");
    if (state === "lock") lock.classList.add("dragging");
  });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.dy = e.clientY - drag.y;
    if (state === "lock") {
      const up = Math.min(0, drag.dy);
      lock.style.transform = `translateY(${up}px)`;
      lock.style.opacity = 1 + up / 400;
    } else if (state === "app") {
      const up = Math.min(0, drag.dy);
      $("appLayer").style.transform = `translateY(${up / 2}px) scale(${1 + up / 1200})`;
      $("appLayer").style.borderRadius = `${Math.min(40, -up / 4)}px`;
    }
  });
  window.addEventListener("pointerup", () => {
    if (!drag) return;
    const { dy, t } = drag, dragApp = drag.app;
    const fast = Math.abs(dy) / (performance.now() - t) > 0.5;
    drag = null;
    lock.classList.remove("dragging");
    lock.style.transform = lock.style.opacity = "";
    const layer = $("appLayer");
    layer.classList.remove("dragging");
    layer.style.transform = layer.style.borderRadius = "";
    if (state === "lock" && (dy < -120 || (fast && dy < -30))) show("passcode");
    else if (state === "home" && (dy > 120 || (fast && dy > 30))) show("lock");
    else if (state === "home" && dragApp && Math.abs(dy) < 8) openApp(dragApp);
    else if (state === "app" && (dy < -60 || (fast && dy < -20))) closeApp();
  });

  // ---- Apps: tap an icon to open its screen, swipe up from the bottom edge to close ----
  let openAppName = null;
  function openApp(appEl) {
    const name = openAppName = appEl.dataset.app;
    const layer = $("appLayer");
    const tpl = document.querySelector(`template[data-app="${name}"]`);
    layer.innerHTML = "";
    if (tpl) {
      layer.append(tpl.content.cloneNode(true));
    } else {
      layer.innerHTML = `<div class="app-placeholder">
        <div class="app">${appEl.querySelector(".icon").outerHTML}</div>
        <b>${name}</b>
        <span>This app's screen hasn't been added yet.<br>Swipe up from the bottom to go back.</span>
      </div>`;
    }
    // grow out of the tapped icon
    const icon = appEl.querySelector(".icon").getBoundingClientRect(), box = phone.getBoundingClientRect();
    layer.style.transformOrigin = `${icon.left + icon.width / 2 - box.left}px ${icon.top + icon.height / 2 - box.top}px`;
    APP_SETUP[name]?.(layer);
    layer.scrollTop = 0;
    phone.classList.toggle("dark-status", tpl?.dataset.status !== "light");
    state = "app";
    phone.classList.add("app-open");
  }
  const waState = {};
  let notesDone = null;
  const APP_KEYS = {};   // per-app keyboard handlers; return true when the key was used
  // Extra code for app screens that are built from CONFIG.
  const APP_SETUP = {
    Notes(layer) {
      const N = CONFIG.notes, notes = N.notes;
      const $l = sel => layer.querySelector(sel);
      const page = id => layer.querySelectorAll(".nt-page").forEach(pg => pg.classList.toggle("on", pg.id === id));
      const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      // ticks made while reading are remembered until the page reloads
      notesDone ??= notes.map(n => n.text.split("\n").map(l => /^\[x\]/i.test(l)));
      const docHTML = i => notes[i].text.split("\n").map((line, j) => {
        if (j === 0) return `<h2>${inline(line)}</h2>`;
        const m = line.match(/^\[( |x)\] ?(.*)$/i);
        if (m) return `<div class="ck${notesDone[i][j] ? " done" : ""}" data-line="${j}"><i></i><span>${inline(m[2])}</span></div>`;
        return `<p>${inline(line)}</p>`;
      }).join("");
      const title = n => n.text.split("\n")[0];

      $l("#ntFolder").textContent = N.folder;
      $l("#ntCount").textContent = `${notes.length} Note${notes.length === 1 ? "" : "s"}`;
      const renderList = () => {
        const sections = [...new Set(notes.map(n => n.section || ""))];
        $l("#ntSections").innerHTML = sections.map(sec => `
          ${sec ? `<div class="nt-sec">${esc(sec)}</div>` : ""}
          <div class="nt-grid">${notes.map((n, i) => (n.section || "") !== sec ? "" : `
            <div class="nt-card" data-note="${i}">
              <div class="nt-thumb"><div class="mini nt-doc" style="padding:28px 30px">${docHTML(i)}</div></div>
              <div class="t">${inline(title(n))}</div>
              <div class="d">${esc(n.time || "")}</div>
            </div>`).join("")}</div>`).join("");
      };
      renderList();

      let cur = null;
      const openNote = i => {
        cur = i;
        $l("#ntDate").textContent = notes[i].date || "";
        $l("#ntDoc").innerHTML = docHTML(i);
        $l("#ntNote .nt-scroll").scrollTop = 0;
        page("ntNote");
      };
      $l("#ntSections").addEventListener("click", e => {
        const c = e.target.closest("[data-note]");
        if (c) openNote(+c.dataset.note);
      });
      $l("#ntDoc").addEventListener("click", e => {
        const ck = e.target.closest(".ck");
        if (!ck || !e.target.closest("i")) return;
        const j = +ck.dataset.line;
        notesDone[cur][j] = !notesDone[cur][j];
        ck.classList.toggle("done", notesDone[cur][j]);
      });
      $l("#ntBack").addEventListener("click", () => { renderList(); page("ntList"); });
      $l("#ntClose").addEventListener("click", closeApp);
      APP_KEYS.Notes = e => {
        if (e.key !== "Escape" || !$l("#ntNote").classList.contains("on")) return false;
        $l("#ntBack").click();
        return true;
      };
    },
    Photos(layer) {
      const P = CONFIG.photos;
      const $l = sel => layer.querySelector(sel);
      const fmt = t => `${Math.floor(t / 60)}:${pad(Math.floor(t % 60))}`;
      const ALBUMS = [
        { title: P.title, items: P.items, count: P.count },
        { title: P.hidden.title, items: P.hidden.items, count: P.hidden.count, locked: true },
      ];
      let album = ALBUMS[0], items = album.items;

      const page = id => layer.querySelectorAll(".ph-page").forEach(pg => pg.classList.toggle("on", pg.id === id));
      function openAlbum(a) {
        album = a; items = a.items;
        $l("#phTitle").textContent = a.title;
        $l("#phCount").textContent = `${a.count ?? items.length} Items`;
        $l("#phGrid").innerHTML = items.map((it, i) => `
          <div class="ph-tile" data-i="${i}">
            <img src="${src(it.type === "video" ? it.poster || "" : it.src)}" alt="" loading="lazy">
            ${it.type === "video" ? `<span class="dur" data-dur="${i}"></span>` : ""}
          </div>`).join("");
        // fill in video lengths from the files themselves
        items.forEach((it, i) => {
          if (it.type !== "video") return;
          const v = document.createElement("video");
          v.preload = "metadata";
          v.onloadedmetadata = () => {
            const d = album === a && layer.querySelector(`[data-dur="${i}"]`);
            if (d) d.textContent = fmt(v.duration);
          };
          v.src = src(it.src);
        });
        $l("#phAlbumPage .ph-scroll").scrollTop = 0;
        page("phAlbumPage");
      }

      // Albums page
      const cover = a => {
        if (a.locked) return `<svg width="54" height="40" viewBox="0 0 54 40" fill="none" stroke="#8e8e93" stroke-width="2.6" stroke-linecap="round"><path d="M3 20s9-15 24-15 24 15 24 15-9 15-24 15S3 20 3 20Z"/><circle cx="27" cy="20" r="7"/><path d="M8 37 46 3"/></svg>`;
        const it = a.items[0];
        return it ? `<img src="${src(it.type === "video" ? it.poster || "" : it.src)}" alt="">` : "";
      };
      $l("#phAlbums").innerHTML = ALBUMS.map((a, i) => `
        <div class="ph-alb" data-album="${i}">
          <div class="cover">${cover(a)}</div>
          <b>${esc(a.title)}${a.locked ? `<svg width="11" height="14" viewBox="0 0 10 13"><path d="M2.5 5.5V3.8a2.5 2.5 0 0 1 5 0v1.7" fill="none" stroke="#000" stroke-width="1.5"/><rect y="5.5" width="10" height="7.5" rx="1.6"/></svg>` : ""}</b>
          <span>${a.locked ? "Locked" : a.count ?? a.items.length}</span>
        </div>`).join("");
      $l("#phAlbums").addEventListener("click", e => {
        const el = e.target.closest("[data-album]");
        if (!el) return;
        const a = ALBUMS[+el.dataset.album];
        if (a.locked) { code = ""; renderDots(); page("phLock"); }
        else openAlbum(a);
      });
      $l("#phAlbumsClose").addEventListener("click", closeApp);

      // Hidden album passcode (CONFIG.photos.hidden.passcode)
      const LETTERS = ["", "ABC", "DEF", "GHI", "JKL", "MNO", "PQRS", "TUV", "WXYZ"];
      $l("#phKeys").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `
        <button class="ph-key${n === 0 ? " zero" : ""}" type="button" data-n="${n}"><b>${n}</b>${n ? `<small>${LETTERS[n - 1]}</small>` : ""}</button>`).join("");
      let code = "";
      const renderDots = () => {
        [...$l("#phDots").children].forEach((d, i) => d.classList.toggle("on", i < code.length));
        $l("#phCancel").textContent = code ? "Delete" : "Cancel";
      };
      const pressKey = n => {
        if (code.length >= 6) return;
        const k = $l(`.ph-key[data-n="${n}"]`);
        k.classList.add("pressed"); setTimeout(() => k.classList.remove("pressed"), 120);
        code += n; renderDots();
        if (code.length < 6) return;
        setTimeout(() => {
          if (code === String(P.hidden.passcode)) { code = ""; renderDots(); openAlbum(ALBUMS[1]); }
          else {
            $l("#phDots").classList.add("shake");
            navigator.vibrate?.(200);
            setTimeout(() => { $l("#phDots").classList.remove("shake"); code = ""; renderDots(); }, 450);
          }
        }, 120);
      };
      $l("#phKeys").addEventListener("pointerdown", e => { const k = e.target.closest(".ph-key"); if (k) pressKey(k.dataset.n); });
      $l("#phCancel").addEventListener("click", () => {
        if (code) { code = code.slice(0, -1); renderDots(); }
        else page("phAlbumsPage");
      });

      openAlbum(ALBUMS[0]);

      const view = $l("#phView"), stage = $l("#phStage");
      let cur = -1, video = null;
      const show = i => {
        if (i < 0 || i >= items.length) return;
        video?.pause();
        cur = i;
        const it = items[i];
        $l("#phDate").textContent = it.date || "";
        $l("#phIdx").textContent = `${i + 1} of ${items.length}`;
        view.classList.toggle("is-video", it.type === "video");
        if (it.type === "video") {
          stage.innerHTML = `<video src="${src(it.src)}" poster="${src(it.poster || "")}" playsinline preload="auto"></video>
            <span class="ph-play"><svg width="26" height="28" viewBox="0 0 18 20"><path d="M2 1.5v17L17 10Z" fill="#fff"/></svg></span>`;
          const v = video = stage.querySelector("video");
          v.onplay = () => stage.classList.add("playing");
          v.onpause = v.onended = () => stage.classList.remove("playing");
          v.onloadedmetadata = () => { $l("#phDur").textContent = fmt(v.duration); };
          v.ontimeupdate = () => {
            if (v !== video) return;
            $l("#phCur").textContent = fmt(v.currentTime);
            $l("#phFill").style.width = `${(v.currentTime / (v.duration || 1)) * 100}%`;
          };
          $l("#phFill").style.width = "0"; $l("#phCur").textContent = "0:00";
          video.play().catch(() => {});
        } else {
          video = null;
          stage.innerHTML = `<img src="${src(it.src)}" alt="">`;
        }
      };
      const open = i => {
        show(i);
        view.classList.add("open");
        phone.classList.remove("dark-status");   // white status bar over the black viewer
      };
      const close = () => {
        video?.pause();
        view.classList.remove("open");
        phone.classList.add("dark-status");
      };

      $l("#phGrid").addEventListener("click", e => {
        const t = e.target.closest(".ph-tile");
        if (t) open(+t.dataset.i);
      });
      // back from an album goes to the Albums page (the Hidden album locks again)
      $l("#phBack").addEventListener("click", () => page("phAlbumsPage"));
      $l("#phClose").addEventListener("click", close);
      $l("#phHeart").addEventListener("click", e => {
        const h = e.currentTarget, on = h.getAttribute("fill") !== "none";
        h.setAttribute("fill", on ? "none" : "currentColor");
      });
      $l("#phTrack").addEventListener("click", e => {
        if (!video) return;
        const r = e.currentTarget.getBoundingClientRect();
        video.currentTime = ((e.clientX - r.left) / r.width) * (video.duration || 0);
      });
      // tap toggles video playback / the white background; swipe left/right to move, down to close
      let sx = null, sy = 0, moved = false;
      stage.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; moved = false; });
      stage.addEventListener("pointermove", e => {
        if (sx == null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
        stage.style.transition = "none";
        stage.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${Math.max(0, dy)}px)`;
      });
      const end = e => {
        if (sx == null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        sx = null;
        stage.style.transition = ""; stage.style.transform = "";
        if (!moved) {
          if (video) video.paused ? video.play() : video.pause();
          else view.classList.toggle("light");
        } else if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1));
        else if (dy > 100) close();
      };
      stage.addEventListener("pointerup", end);
      stage.addEventListener("pointercancel", end);
      APP_KEYS.Photos = e => {
        if ($l("#phLock").classList.contains("on")) {
          if (/^\d$/.test(e.key)) pressKey(e.key);
          else if (e.key === "Backspace" || e.key === "Escape") $l("#phCancel").click();
          else return false;
          return true;
        }
        if (!view.classList.contains("open")) return false;
        if (e.key === "ArrowRight") show(cur + 1);
        else if (e.key === "ArrowLeft") show(cur - 1);
        else if (e.key === "Escape") close();
        else if (e.key === " " && video) video.paused ? video.play() : video.pause();
        else return false;
        return true;
      };
    },
    WhatsApp(layer) {
      const WA = CONFIG.whatsapp;
      const lockNotifs = CONFIG.notifications.map((n, i) => ({ ...n, ...saved[i] }));
      const chats = WA.chats.map(c => {
        if (c.fromNotification == null) return c;
        const n = lockNotifs[c.fromNotification];
        const history = [...(c.history || []), { day: "Today", from: "them", text: n.message, time: c.time }];
        return { name: n.name, avatar: n.avatar, message: n.message, ...c, history };
      });
      const ic = {
        ticks: `<svg width="17" height="11" viewBox="0 0 17 11" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7.5M7.5 8.5l.5.5 6-7.5" stroke="#8696a0"/></svg>`,
        photo: `<svg width="15" height="12" viewBox="0 0 26 20" fill="#8696a0"><path d="M9 1h8l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4Z"/><circle cx="13" cy="11.5" r="4" fill="#fff"/></svg>`,
        doc: `<svg width="11" height="14" viewBox="0 0 11 14" fill="#8696a0"><path d="M1.5 0H7l4 4v8.5a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 0 12.5v-11A1.5 1.5 0 0 1 1.5 0Z"/></svg>`,
        mic: `<svg width="10" height="14" viewBox="0 0 16 22"><rect x="4" y="1" width="8" height="13" rx="4" fill="#8696a0"/><path d="M1 10a7 7 0 0 0 14 0M8 17v4" fill="none" stroke="#8696a0" stroke-width="2" stroke-linecap="round"/></svg>`,
        call: `<svg width="13" height="13" viewBox="0 0 24 24" fill="#8696a0"><path d="M6.6 2.5 9 2l2 4.5-2 1.6a12 12 0 0 0 6.9 6.9l1.6-2 4.5 2-.5 2.4c-.2 1-1 1.6-2 1.6A17.5 17.5 0 0 1 5 4.5c0-1 .6-1.8 1.6-2Z"/></svg>`,
        video: `<svg width="16" height="11" viewBox="0 0 26 18" fill="#8696a0"><rect x="1" y="2" width="16" height="14" rx="3.5"/><path d="M17 7.5 25 3v12l-8-4.5Z"/></svg>`,
        ban: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#8696a0" stroke-width="1.5"><circle cx="7" cy="7" r="5.8"/><path d="M3 3l8 8"/></svg>`,
        muted: `<svg width="18" height="18" viewBox="0 0 24 24" fill="#8696a0"><path d="M12 22a2.5 2.5 0 0 0 2.4-2H9.6A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5-6.7V3.5a2 2 0 0 0-4 0v.8a7 7 0 0 0-1.6.7L19 15.6ZM3.3 2.3 2 3.6l3.4 3.4A7 7 0 0 0 5 9v7l-2 2v1h14.4l2.9 2.9 1.3-1.3Z"/></svg>`,
        person: `<svg width="24" height="26" viewBox="0 0 12 13" fill="#a0614a"><circle cx="6" cy="3.5" r="3"/><path d="M0 13a6 6 0 0 1 12 0Z"/></svg>`,
        group: `<svg width="30" height="22" viewBox="0 0 30 22" fill="#a0614a"><circle cx="10" cy="5.5" r="4.5"/><circle cx="21" cy="6" r="4"/><path d="M0 21a10 9 0 0 1 20 0ZM17 21a9 9 0 0 0-2.5-6.5 8 8 0 0 1 15.5 6.5Z"/></svg>`,
      };
      const avatar = (c, ring = c.status) => c.avatar
        ? `<img class="wa-av${ring ? " ring" : ""}" src="${src(c.avatar)}" alt="">`
        : `<div class="wa-av${ring ? " ring" : ""}">${c.group ? ic.group : ic.person}</div>`;

      // what the chat list shows: the latest message once a conversation has moved on
      const listView = (c, i) => {
        const st = waState[i];
        if (!st) return c;
        const last = st.log[st.log.length - 1];
        const label = last.type === "photo" ? (last.text || "Photo")
                    : last.type === "voice" ? (last.duration || "Voice message")
                    : last.type === "doc" ? [last.name, last.pages && `${last.pages} pages`].filter(Boolean).join(" • ")
                    : last.type === "call" ? callTitle(last) : last.text;
        const media = { photo: "photo", voice: "mic", doc: "doc", call: last.call === "video" ? "video" : "call" }[last.type] || null;
        return { ...c, message: label, sent: last.from === "me", time: last.time, unread: 0,
                 media, deleted: last.type === "deleted", sender: c.group && last.from === "them" ? last.sender : null };
      };
      const preview = c => {
        let t = c.sent ? ic.ticks + " " : "";
        if (c.sender) t += `${esc(c.sender)}: `;
        if (c.deleted) return t + `${ic.ban} <em>This message was deleted.</em>`;
        if (c.media) t += ic[c.media] + " ";
        return t + esc(c.message || "");
      };
      let filter = "all";
      const renderList = () => {
        const shown = chats.map((c, i) => [listView(c, i), i])
          .filter(([c]) => filter === "unread" ? c.unread : filter === "favorites" ? c.favorite : filter === "groups" ? c.group : true);
        layer.querySelector("#waList").innerHTML = shown.map(([c, i]) => `
          <div class="wa-row" data-chat="${i}">
            ${avatar(c)}
            <div class="main">
              <div class="wa-line"><span class="wa-name">${esc(c.name)}</span><span class="wa-time${c.unread ? " unread" : ""}">${esc(c.time || "")}</span></div>
              <div class="wa-prev"><span class="txt">${preview(c)}</span>${c.unread ? `<span class="wa-badge">${c.unread}</span>` : c.muted ? ic.muted : ""}</div>
            </div>
          </div>`).join("") || `<div class="wa-empty">No chats here</div>`;
      };
      layer.querySelector("#waArchived").textContent = WA.archived || "";
      layer.querySelector("#waChips").addEventListener("click", e => {
        const chip = e.target.closest("[data-filter]");
        if (!chip) return;
        layer.querySelectorAll(".wa-chip").forEach(c => c.classList.toggle("on", c === chip));
        filter = chip.dataset.filter;
        renderList();
      });
      renderList();

      // ---- chat room ----
      const room = layer.querySelector("#waRoom"), msgs = layer.querySelector("#waMsgs");
      const typed = layer.querySelector("#waTyped"), sub = layer.querySelector("#waRoomSub");
      const now = () => CONFIG.time ?? (d => `${pad(d.getHours())}.${pad(d.getMinutes())}`)(new Date());
      const wait = ms => new Promise(r => setTimeout(r, ms));
      let run = 0;       // bumps whenever the room closes, so pending timers stop
      let chatIdx = null, pendingReply = null, typing = false;

      // keyboard
      const kbRows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
      layer.querySelector("#waKb").innerHTML = `<div class="rows">
        ${kbRows.map((r, i) => `<div class="row">
          ${i === 2 ? `<span class="wa-key fn" data-k="shift">⇧</span>` : ""}
          ${[...r].map(ch => `<span class="wa-key" data-k="${ch}">${ch}</span>`).join("")}
          ${i === 2 ? `<span class="wa-key fn" data-k="del">⌫</span>` : ""}
        </div>`).join("")}
        <div class="row"><span class="wa-key fn" data-k="num">123</span><span class="wa-key fn" data-k="emoji">☺</span>
          <span class="wa-key space" data-k=" ">space</span><span class="wa-key fn ret" data-k="ret">return</span></div>
      </div>
      <div class="bar"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#555" stroke-width="1.5"><circle cx="11" cy="11" r="9.5"/><path d="M2 11h18M11 1.5c3 3 3 16 0 19M11 1.5c-3 3-3 16 0 19"/></svg>
        <svg width="16" height="22" viewBox="0 0 16 22" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="1" width="8" height="13" rx="4"/><path d="M1 10a7 7 0 0 0 14 0M8 17v4"/></svg></div>`;
      const keyFor = ch => {
        const low = ch.toLowerCase();
        if (/[a-z]/.test(low)) return low === ch ? low : "shift";
        return ch === " " ? " " : "num";
      };
      const tapKey = k => {
        const el = layer.querySelector(`.wa-key[data-k="${CSS.escape(k)}"]`);
        if (!el) return;
        el.classList.add("down");
        setTimeout(() => el.classList.remove("down"), 90);
      };

      const tickSvg = `<svg width="16" height="11" viewBox="0 0 17 11" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7.5M7.5 8.5l.5.5 6-7.5" stroke="#8696a0"/></svg>`;
      const meta = (m, extra = "") => `<span class="meta${m.read ? " read" : ""}${extra}">${m.edited ? "Edited " : ""}${esc(m.time || "")}${m.from === "me" ? tickSvg : ""}</span>`;
      const secs = d => { const [a, b] = String(d || "0:00").split(":").map(Number); return b == null ? a : a * 60 + b; };
      // waveform bars: the same voice note always gets the same shape
      const wave = (seed, color) => {
        let h = [...String(seed)].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
        const bars = Array.from({ length: 31 }, (_, i) => {
          h = (h * 1103515245 + 12345) >>> 0;
          const v = 4 + (h >>> 16) % 17;
          return `<rect x="${i * 6}" y="${13 - v / 2}" width="3" height="${v}" rx="1.5"/>`;
        }).join("");
        return `<svg viewBox="0 0 186 26" width="186" height="26" fill="${color}" preserveAspectRatio="none">${bars}</svg>`;
      };
      const callIcon = (video, color) => video
        ? `<svg width="20" height="14" viewBox="0 0 26 18" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"><rect x="1" y="2" width="16" height="14" rx="3.5"/><path d="M17 7.5 25 3v12l-8-4.5"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="${color}"><path d="M6.6 2.5 9 2l2 4.5-2 1.6a12 12 0 0 0 6.9 6.9l1.6-2 4.5 2-.5 2.4c-.2 1-1 1.6-2 1.6A17.5 17.5 0 0 1 5 4.5c0-1 .6-1.8 1.6-2Z"/></svg>`;
      function callTitle(m) {
        const kind = m.call === "video" ? "video" : "voice";
        return m.missed ? `Missed ${kind} call` : `${kind[0].toUpperCase() + kind.slice(1)} call`;
      }

      // group members: name colour and avatar
      const MEMBER_COLORS = ["#1f8f6f", "#c0347a", "#2b7bb9", "#b8650f", "#7a4fc2", "#d0453b", "#3f8f26"];
      const member = name => {
        const ms = chats[chatIdx].members || [];
        const i = Math.max(0, ms.findIndex(x => x.name === name));
        return { name, ...ms[i], color: ms[i]?.color || MEMBER_COLORS[i % MEMBER_COLORS.length] };
      };
      const letterAv = mb => mb.avatar ? avatar(mb, false)
        : `<div class="wa-av" style="background:${mb.color}">${esc((mb.name || "?").replace(/^(Bang|Kak|Adek|Dek)\s+/i, "")[0] || "?")}</div>`;
      const fwd = `<span class="wa-fwd"><svg width="15" height="13" viewBox="0 0 15 13" fill="#fff"><path d="M8.5 0 15 6l-6.5 6V8.3C4 8.3 1.6 9.8 0 13 .6 8 3 4.4 8.5 3.7Z"/></svg></span>`;

      const msgBody = m => {
        const c = chats[chatIdx];
        if (m.type === "photo") {
          return `<img src="${src(m.src || "")}" alt="">` +
            (m.text ? `<div class="cap">${esc(m.text)}${meta(m)}</div>` : meta(m, " over")) + fwd;
        }
        if (m.type === "doc") {
          const ext = (m.ext || (m.name || "").split(".").pop() || "file").toLowerCase();
          const info = [m.pages && `${m.pages} page${m.pages > 1 ? "s" : ""}`, m.size, ext].filter(Boolean).join(" • ");
          return (m.preview ? `<img class="pv" src="${src(m.preview)}" alt="">` : "") +
            `<div class="wa-docrow"><span class="ext">${esc(ext.toUpperCase().slice(0, 4))}</span>
              <span class="t"><b>${esc(m.name || "Document")}</b><span>${esc(info)}</span></span></div>` + meta(m) + fwd;
        }
        if (m.type === "deleted") {
          return `<span class="wa-del">${ic.ban}${m.from === "me" ? "You deleted this message." : "This message was deleted."}</span>` + meta(m);
        }
        if (m.type === "voice") {
          const who = m.from === "me" ? { avatar: CONFIG.whatsapp.myAvatar } : c;
          const mic = `<svg class="mic" width="16" height="18" viewBox="0 0 16 22"><rect x="4" y="1" width="8" height="13" rx="4" fill="${m.from === "me" ? "#1daa61" : "#34b7f1"}"/><path d="M1 10a7 7 0 0 0 14 0M8 17v4" fill="none" stroke="${m.from === "me" ? "#1daa61" : "#34b7f1"}" stroke-width="2" stroke-linecap="round"/></svg>`;
          return `<div class="wa-voice">
              <button class="wa-vplay" type="button" aria-label="Play"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1.5v17L17 10Z" fill="#54656f"/></svg></button>
              <div class="wa-wave">${wave(m.duration + m.time, "#b4bcc1")}<div class="done">${wave(m.duration + m.time, m.from === "me" ? "#1daa61" : "#34b7f1")}</div><i class="knob"></i></div>
              <div class="wa-vav">${avatar(who, false)}${mic}</div>
            </div>
            <div class="wa-vfoot"><span class="dur">${esc(m.duration || "0:00")}</span>${meta(m)}</div>`;
        }
        if (m.type === "call") {
          const sub = m.missed ? (m.from === "me" ? "No answer" : "Tap to call back") : (m.duration || "Tap to call back");
          return `<div class="wa-call"><span class="ci">${callIcon(m.call === "video", m.missed ? "#ea0038" : "#0b141a")}</span>
            <span class="t"><b>${callTitle(m)}</b><span>${esc(sub)}</span></span></div>${meta(m)}`;
        }
        let q = "";
        if (m.reply) {
          const mine = m.reply.from === "me";
          const qName = mine ? "You" : c.group ? (m.reply.sender || "") : c.name;
          const qColor = mine ? "" : c.group ? ` style="--qc:${member(m.reply.sender).color}"` : "";
          q = `<span class="wa-quote q-${mine ? "me" : "them"}"${qColor}><b>${esc(qName)}</b><span>${esc(m.reply.text || "")}</span></span>`;
        }
        return q + esc(m.text || "") + meta(m);
      };
      // consecutive messages from the same person on the same day form one run
      const sameRun = (a, b) => a && b && a.from === b.from && a.day === b.day && (a.sender || "") === (b.sender || "");
      const bubble = (m, prev, next) => {
        const first = !sameRun(prev, m), tail = !sameRun(m, next);
        const inGroup = chats[chatIdx].group && m.from === "them";
        const mb = inGroup ? member(m.sender) : null;
        const name = inGroup && first ? `<b class="wa-sender" style="color:${mb.color}">${esc(m.sender || "")}</b>` : "";
        const gav = inGroup && tail ? `<span class="wa-gav">${letterAv(mb)}</span>` : "";
        return (m.day !== prev?.day ? `<div class="wa-day">${esc(m.day)}</div>` : "") +
          `<div class="wa-msg ${m.from} ${m.type || "text"}${first ? " first" : ""}${tail ? " tail" : ""}">${name}${msgBody(m)}${gav}</div>`;
      };
      const addBubble = m => {
        const log = waState[chatIdx].log, prev = log[log.length - 2];
        // the previous bubble loses its tail (and group avatar) when the same person sends again
        if (sameRun(prev, m)) {
          msgs.lastElementChild?.classList.remove("tail");
          msgs.lastElementChild?.querySelector(":scope > .wa-gav")?.remove();
        }
        msgs.insertAdjacentHTML("beforeend", bubble(m, prev, null));
        msgs.scrollTop = msgs.scrollHeight;
        return msgs.lastElementChild;
      };
      const setHasText = () => room.classList.toggle("has-text", typed.textContent.length > 0);
      const markRead = async (msg, el) => {
        await wait(900);
        msg.read = true;
        el.querySelector(".meta").classList.add("read");
      };
      const status = t => { sub.textContent = t; sub.classList.toggle("typing", t.endsWith("…")); };

      async function play(myRun) {
        const c = chats[chatIdx], st = waState[chatIdx];
        while (myRun === run && st.step < (c.script || []).length) {
          const m = c.script[st.step];
          const isText = !m.type || m.type === "text";
          if (m.from === "me" && isText) {
            pendingReply = m;
            if (room.classList.contains("kb")) typeReply(myRun);
            return;   // continues after the reply is sent
          }
          await wait(m.delay ?? (m.from === "me" ? 1200 : 900));
          if (myRun !== run) return;
          if (m.from === "them" && m.type !== "call") {
            const who = c.group && m.sender ? `${m.sender} is ` : "";
            status(who + (m.type === "voice" ? "recording audio…" : "typing…"));
            await wait(m.type === "voice" ? Math.min(4000, 800 + secs(m.duration) * 120)
                     : Math.min(4000, 700 + (m.text || "").length * 45));
            if (myRun !== run) return;
            status(c.group ? groupInfo(c) : "online");
          }
          const msg = { ...m, day: "Today", time: now() };
          delete msg.delay;
          st.log.push(msg); st.step++;
          const el = addBubble(msg);
          if (m.from === "me") markRead(msg, el);
        }
      }

      // voice notes: tap play to run the progress (plays the real file if audio: is set)
      let playing = null;
      msgs.addEventListener("click", e => {
        const btn = e.target.closest(".wa-vplay");
        if (!btn) return;
        const el = btn.closest(".wa-msg"), idx = [...msgs.querySelectorAll(".wa-msg")].indexOf(el);
        const m = waState[chatIdx].log[idx];
        if (playing) { playing.stop(); if (playing.el === el) { playing = null; return; } }
        const total = secs(m.duration) || 1, dur = el.querySelector(".dur");
        const audio = m.audio ? new Audio(src(m.audio)) : null;
        audio?.play().catch(() => {});
        const t0 = performance.now();
        const icon = (pause) => btn.innerHTML = pause
          ? `<svg width="18" height="20" viewBox="0 0 18 20" fill="#54656f"><rect x="2" y="1.5" width="5" height="17" rx="1"/><rect x="11" y="1.5" width="5" height="17" rx="1"/></svg>`
          : `<svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1.5v17L17 10Z" fill="#54656f"/></svg>`;
        let raf;
        const stop = () => { cancelAnimationFrame(raf); audio?.pause(); icon(false); el.style.removeProperty("--p"); dur.textContent = m.duration || "0:00"; };
        const step = () => {
          const t = audio ? audio.currentTime : (performance.now() - t0) / 1000;
          const p = Math.min(1, t / (audio?.duration || total));
          el.style.setProperty("--p", `${p * 100}%`);
          dur.textContent = `${Math.floor(t / 60)}:${pad(Math.floor(t % 60))}`;
          if (p >= 1 || (audio && audio.ended)) { stop(); playing = null; return; }
          raf = requestAnimationFrame(step);
        };
        icon(true);
        playing = { el, stop };
        step();
      });

      async function typeReply(myRun) {
        if (!pendingReply || typing || typed.textContent) return;
        typing = true;
        await wait(350);
        for (const ch of pendingReply.text) {
          if (myRun !== run) { typing = false; return; }
          tapKey(keyFor(ch));
          typed.textContent += ch;
          setHasText();
          layer.querySelector("#waInput").scrollTop = 1e6;
          await wait(ch === " " ? 70 : 45 + Math.random() * 70);
        }
        typing = false;
      }

      async function send() {
        if (!pendingReply || typing || !typed.textContent) return;
        const st = waState[chatIdx], myRun = run;
        const msg = { day: "Today", from: "me", text: pendingReply.text, time: now() };
        pendingReply = null;
        typed.textContent = ""; setHasText();
        st.log.push(msg); st.step++;
        const el = addBubble(msg);
        await markRead(msg, el);
        if (myRun === run) play(myRun);
      }

      const groupInfo = c => [...(c.members || []).map(x => x.name), "You"].join(", ");
      function openChat(i) {
        chatIdx = i;
        const c = chats[i];
        if (!waState[i]) {
          let day = "Today";
          waState[i] = { log: (c.history || []).map(m => ({ ...m, day: (day = m.day ?? day), read: true })), step: 0 };
        }
        layer.querySelector("#waRoomAv").innerHTML = avatar(c, false);
        layer.querySelector("#waRoomName").textContent = c.name;
        status(c.group ? groupInfo(c) : "tap for contact info");
        room.classList.toggle("group", !!c.group);
        typed.textContent = ""; setHasText(); pendingReply = null; typing = false;
        room.classList.remove("kb");
        const log = waState[i].log;
        msgs.innerHTML = log.map((m, j) => bubble(m, log[j - 1], log[j + 1])).join("");
        msgs.style.backgroundImage = `url("${src(CONFIG.whatsapp.chatWallpaper || CONFIG.wallpaper)}")`;
        room.classList.add("open");
        requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
        play(++run);
      }
      function closeChat() {
        run++;
        if (playing) { playing.stop(); playing = null; }
        room.classList.remove("open", "kb");
        renderList();
      }

      layer.querySelector("#waList").addEventListener("click", e => {
        const row = e.target.closest("[data-chat]");
        if (row) openChat(+row.dataset.chat);
      });
      layer.querySelector("#waBack").addEventListener("click", closeChat);
      layer.querySelector("#waInput").addEventListener("click", () => {
        room.classList.add("kb");
        setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 320);
        typeReply(run);
      });
      msgs.addEventListener("click", e => { if (!e.target.closest(".wa-vplay")) room.classList.remove("kb"); });
      layer.querySelector("#waSend").addEventListener("click", send);
    },
  };

  function closeApp() {
    $("appLayer").querySelectorAll("video, audio").forEach(m => m.pause());
    state = "home";
    phone.classList.remove("app-open");
  }

  // Keypad
  const LETTERS = ["", "ABC", "DEF", "GHI", "JKL", "MNO", "PQRS", "TUV", "WXYZ"];
  $("keypad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `
    <button class="key${n === 0 ? " zero" : ""}" type="button" data-n="${n}">
      <b>${n}</b>${n ? `<small>${LETTERS[n - 1]}</small>` : ""}
    </button>`).join("");

  let code = "";
  const dots = [...$("dots").children];
  function render() {
    dots.forEach((d, i) => d.classList.toggle("on", i < code.length));
    $("cancelBtn").textContent = code ? "Delete" : "Cancel";
  }
  function clearCode() { code = ""; render(); }
  function press(n) {
    if (code.length >= 6) return;
    code += n;
    render();
    if (code.length < 6) return;
    setTimeout(() => {
      if (code === CONFIG.passcode) {
        show("home");
      } else {
        $("dots").classList.add("shake");
        navigator.vibrate?.(200);
        setTimeout(() => { $("dots").classList.remove("shake"); clearCode(); }, 450);
      }
    }, 120);
  }
  function flash(n) {
    const k = $("keypad").querySelector(`[data-n="${n}"]`);
    k.classList.add("pressed");
    setTimeout(() => k.classList.remove("pressed"), 120);
  }
  $("keypad").addEventListener("pointerdown", e => {
    const k = e.target.closest(".key");
    if (!k) return;
    flash(k.dataset.n);
    press(k.dataset.n);
  });
  $("cancelBtn").addEventListener("click", () => {
    if (code) { code = code.slice(0, -1); render(); }
    else show("lock");
  });

  window.addEventListener("keydown", e => {
    if (document.activeElement?.isContentEditable) return;
    if (state === "passcode") {
      if (/^\d$/.test(e.key)) { flash(e.key); press(e.key); }
      else if (e.key === "Backspace") $("cancelBtn").click();
      else if (e.key === "Escape") show("lock");
    } else if (state === "lock" && (e.key === "ArrowUp" || e.key === " " || e.key === "Enter")) {
      show("passcode");
    } else if (state === "app" && APP_KEYS[openAppName]?.(e)) {
      e.preventDefault();
    } else if (state === "app" && (e.key === "Escape" || e.key === "ArrowUp")) {
      closeApp();
    } else if (state === "home" && (e.key === "ArrowDown" || e.key === "Escape")) {
      show("lock");
    }
  });
</script>
</body>
</html>
