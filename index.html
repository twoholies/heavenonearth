<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hesa's Lock Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(110, 110, 118, 0.38);
    --text: #fff;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
    color: var(--text);
  }

  .phone {
    position: relative;
    width: min(402px, 100vw);
    aspect-ratio: 402 / 874;
    max-height: 100vh;
    overflow: hidden;
    border-radius: 0;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  @media (min-width: 500px) { .phone { border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,.6); } }

  .wall {
    position: absolute; inset: 0;
    background: #9fb0c2 center / cover no-repeat;
    transition: filter .45s var(--ease), transform .45s var(--ease);
  }
  .phone.passcode .wall { filter: brightness(.72) saturate(.85); }
  .phone.home .wall { filter: none; transform: scale(1.04); }

  /* status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 22px 0 34px; font-weight: 600; font-size: 15px;
  }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .sb-batt {
    position: relative; width: 27px; height: 13px; border-radius: 4.5px;
    background: rgba(255,255,255,.4); overflow: hidden;
    font-size: 10px; font-weight: 700; line-height: 13px; text-align: center; color: #000; text-shadow: none;
  }
  .sb-batt i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .sb-batt.low-power i { background: #ffd60a; }
  .sb-batt span { position: relative; }

  /* screens */
  .screen {
    position: absolute; inset: 0;
    transition: transform .45s var(--ease), opacity .45s var(--ease);
  }
  .screen.dragging { transition: none; }
  #passcodeScreen, #homeScreen { opacity: 0; pointer-events: none; }
  .phone.passcode #passcodeScreen, .phone.home #homeScreen { opacity: 1; pointer-events: auto; }
  .phone.passcode #lockScreen, .phone.home #lockScreen { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  /* lock screen */
  .lock-icon { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); transition: transform .3s var(--ease); }
  .date {
    position: absolute; top: 96px; width: 100%; text-align: center;
    font-size: 21px; font-weight: 600; letter-spacing: .2px;
  }
  .clock {
    position: absolute; top: 118px; width: 100%; text-align: center;
    font-family: "Fraunces", "New York", Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-size: 116px; font-weight: 700; line-height: 1; letter-spacing: 1px;
    color: rgba(240, 244, 246, .82);
    -webkit-text-stroke: 1px rgba(255,255,255,.9);
    text-shadow: 0 2px 4px rgba(0,0,0,.18);
  }

  .notifs {
    position: absolute; left: 14px; right: 14px; bottom: 214px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .notif {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 22px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,.35);
    text-shadow: none;
  }
  .avatar { position: relative; flex: none; width: 40px; height: 40px; }
  .avatar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; pointer-events: none; }
  .avatar .badge {
    position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px;
    border-radius: 5px; background: #25d366; display: grid; place-items: center;
    border: 1.5px solid rgba(255,255,255,.9);
  }
  .notif .body { flex: 1; min-width: 0; }
  .notif .row { display: flex; justify-content: space-between; align-items: baseline; }
  .notif .name { font-weight: 600; font-size: 15px; color: #fff; }
  .notif .when { font-size: 13px; color: rgba(255,255,255,.75); }
  .notif .msg { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [contenteditable] { outline: none; cursor: text; border-radius: 4px; user-select: text; -webkit-user-select: text; }
  [contenteditable]:focus { background: rgba(255,255,255,.18); text-overflow: clip; }

  .widgets {
    position: absolute; left: 36px; right: 22px; bottom: 140px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .battery-widget { width: 154px; font-size: 16px; font-weight: 600; }
  .battery-widget .top { display: flex; align-items: center; gap: 8px; }
  .battery-widget .device { margin-top: 2px; font-weight: 500; white-space: nowrap; }
  .battery-widget .bar { margin-top: 8px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; }
  .battery-widget .bar span { display: block; height: 100%; background: #fff; border-radius: 4px; }
  .music {
    width: 60px; height: 60px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }

  .btn {
    position: absolute; bottom: 58px; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(16px) brightness(.9); -webkit-backdrop-filter: blur(16px) brightness(.9);
    display: grid; place-items: center; cursor: pointer;
    transition: transform .15s;
  }
  .btn:active { transform: scale(.92); }
  .btn.left { left: 50px; } .btn.right { right: 50px; }
  .focus {
    position: absolute; bottom: 77px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px;
    background: rgba(255,255,255,.1); font-size: 15px; font-weight: 500;
  }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #fff; z-index: 5;
  }
  .swipe-hint {
    position: absolute; bottom: 22px; width: 100%; text-align: center;
    font-size: 13px; color: rgba(255,255,255,.8);
    animation: hint 2.4s ease-in-out infinite;
  }
  @keyframes hint { 0%, 100% { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; transform: none; } }

  /* passcode */
  #passcodeScreen { transform: translateY(40px); }
  .phone.passcode #passcodeScreen { transform: none; }
  .pc-title { position: absolute; top: 166px; width: 100%; text-align: center; font-size: 21px; font-weight: 500; }
  .dots { position: absolute; top: 208px; left: 0; right: 0; display: flex; justify-content: center; gap: 23px; }
  .dots i {
    width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #fff;
    transition: background .1s;
  }
  .dots i.on { background: #fff; }
  .dots.shake { animation: shake .45s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-18px); } 30% { transform: translateX(15px); }
    45% { transform: translateX(-11px); } 60% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
  }
  .keypad {
    position: absolute; top: 318px; left: 0; right: 0;
    display: grid; grid-template-columns: repeat(3, 82px); gap: 15px 30px; justify-content: center;
  }
  .key {
    width: 82px; height: 82px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font: inherit; cursor: pointer;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.45);
    backdrop-filter: blur(6px) saturate(140%); -webkit-backdrop-filter: blur(6px) saturate(140%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.08);
    transition: background .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .key.pressed { background: rgba(255,255,255,.5); transition: none; }
  .key b { font-size: 38px; font-weight: 400; line-height: 1; }
  .key small { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; margin-top: 2px; min-height: 12px; }
  .key.zero { grid-column: 2; }
  .pc-link {
    position: absolute; bottom: 48px; background: none; border: 0; color: #fff;
    font: inherit; font-size: 17px; cursor: pointer; text-shadow: inherit;
  }
  .pc-link.left { left: 40px; width: 100px; } .pc-link.right { right: 40px; width: 100px; }

  /* home (unlocked) */
  .home-msg {
    position: absolute; top: 50%; width: 100%; text-align: center; transform: translateY(-50%);
    font-size: 15px; color: rgba(255,255,255,.9);
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="wall" id="wall"></div>

  <div class="status">
    <span id="carrier"></span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" fill-opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.1 3.6l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2a7 7 0 0 0-10 0l1.2 1.2c1-.9 2.3-1.5 3.8-1.5Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6Z"/></svg>
      <span class="sb-batt" id="sbBatt"><i id="sbBattFill"></i><span id="sbBattNum"></span></span>
    </span>
  </div>

  <!-- 1. Lock screen: swipe up -->
  <section class="screen" id="lockScreen">
    <svg class="lock-icon" id="lockIcon" width="20" height="26" viewBox="0 0 20 26"><path d="M5 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#fff" stroke-width="2.6"/><rect x="1" y="11" width="18" height="14" rx="3" fill="#fff"/></svg>
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <div class="notifs" id="notifs"></div>

    <div class="widgets">
      <div class="battery-widget">
        <div class="top">
          <svg width="12" height="20" viewBox="0 0 12 20"><rect x="1" y="2" width="10" height="17" rx="2.5" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="4" y="0" width="4" height="2" rx=".8" fill="#fff"/></svg>
          <span id="battPct"></span>
        </div>
        <div class="device" id="device"></div>
        <div class="bar"><span id="battBar"></span></div>
      </div>
      <div class="music" aria-label="Music">
        <svg width="40" height="40" viewBox="0 0 40 40"><g fill="none" stroke="#111" stroke-linecap="round"><path d="M7 14c9-3 18-2.5 26 1.5" stroke-width="4"/><path d="M8.5 21c7.5-2.3 15-1.8 21.5 1.3" stroke-width="3.3"/><path d="M10 27.5c6-1.7 11.8-1.3 17 1" stroke-width="2.7"/></g></svg>
      </div>
    </div>

    <div class="btn left" aria-label="Flashlight">
      <svg width="20" height="30" viewBox="0 0 18 26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M2 2h14v4l-3 4v13a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 5 23V10L2 6Z" fill="#fff"/><circle cx="9" cy="15" r="1.4" fill="#555" stroke="none"/></svg>
    </div>
    <div class="focus" id="focus">
      <svg width="15" height="14" viewBox="0 0 24 22" fill="#fff"><path d="M12 21.5 10.3 20C4.2 14.5 0 10.8 0 6.3A6.2 6.2 0 0 1 6.3 0 6.8 6.8 0 0 1 12 2.9 6.8 6.8 0 0 1 17.7 0 6.2 6.2 0 0 1 24 6.3c0 4.5-4.2 8.2-10.3 13.7Z"/></svg>
      <span id="focusName"></span>
    </div>
    <div class="btn right" aria-label="Camera">
      <svg width="28" height="22" viewBox="0 0 26 20" fill="#fff"><path d="M9 1h8l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4Z"/><circle cx="13" cy="11.5" r="5" fill="#555"/><circle cx="13" cy="11.5" r="3.6" fill="#fff"/></svg>
    </div>
    <div class="swipe-hint">Swipe up to open</div>
  </section>

  <!-- 2. Passcode -->
  <section class="screen" id="passcodeScreen">
    <div class="pc-title">Enter Passcode</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="keypad"></div>
    <button class="pc-link left" type="button">Emergency</button>
    <button class="pc-link right" type="button" id="cancelBtn">Cancel</button>
  </section>

  <!-- 3. Unlocked -->
  <section class="screen" id="homeScreen">
    <div class="home-msg">Unlocked — swipe down to lock</div>
  </section>

  <div class="home-bar"></div>
</div>

<script>
  // ---- Edit everything here ----
  const CONFIG = {
    wallpaper: "download - 2026-10-29T181441.295.jpg",
    carrier: "TSEL",
    deviceName: "thefirstfruitmark 🐰",
    battery: 15,
    lowPower: true,          // yellow battery in the status bar
    focus: "Personal",
    passcode: "123456",      // must be 6 digits
    // Set to e.g. "22.27" and "Thu 29 Oct" for a fixed screenshot; null = live clock.
    time: null,
    date: null,
    // Newest first, like iOS. Names and messages can also be edited on the page.
    notifications: [
      { name: "Isaac", avatar: "260116 #MARK 🐯 INSTAGRAM UPDATE.jpg", message: "Sorry for bothering you, Hesa", when: "now" },
      { name: "Niel",  avatar: "🐰.jpg", message: "Hi", when: "now" },
    ],
  };
  // ------------------------------

  const $ = id => document.getElementById(id);
  const src = f => encodeURIComponent(f);
  const phone = $("phone");

  $("wall").style.backgroundImage = `url("${src(CONFIG.wallpaper)}")`;
  $("carrier").textContent = CONFIG.carrier;
  $("device").textContent = CONFIG.deviceName;
  $("battPct").textContent = `${CONFIG.battery}%`;
  $("battBar").style.width = `${CONFIG.battery}%`;
  $("sbBattFill").style.width = `${CONFIG.battery}%`;
  $("sbBattNum").textContent = CONFIG.battery;
  $("sbBatt").classList.toggle("low-power", CONFIG.lowPower);
  $("focusName").textContent = CONFIG.focus;

  const wa = `<svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>`;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Names and messages are editable on the page: tap a contact name or a
  // message, type, then press Enter. Edits are remembered in this browser.
  const SAVE_KEY = "hesa-lockscreen-edits";
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch {}
  const notifs = CONFIG.notifications.map((n, i) => ({ ...n, ...saved[i] }));

  $("notifs").innerHTML = notifs.map((n, i) => `
    <div class="notif">
      <div class="avatar"><img src="${src(n.avatar)}" alt=""><span class="badge">${wa}</span></div>
      <div class="body">
        <div class="row"><span class="name" contenteditable="plaintext-only" spellcheck="false" data-i="${i}" data-field="name">${esc(n.name)}</span><span class="when">${esc(n.when)}</span></div>
        <div class="msg" contenteditable="plaintext-only" spellcheck="false" data-i="${i}" data-field="message">${esc(n.message)}</div>
      </div>
    </div>`).join("");

  $("notifs").addEventListener("keydown", e => {
    if (e.target.isContentEditable && (e.key === "Enter" || e.key === "Escape")) {
      e.preventDefault();
      e.target.blur();
    }
  });
  $("notifs").addEventListener("input", e => {
    const el = e.target;
    if (!el.isContentEditable) return;
    const i = el.dataset.i;
    saved[i] = { ...saved[i], [el.dataset.field]: el.textContent };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); } catch {}
  });

  function tick() {
    const d = new Date();
    $("clock").textContent = CONFIG.time ??
      `${String(d.getHours()).padStart(2, "0")}.${String(d.getMinutes()).padStart(2, "0")}`;
    $("date").textContent = CONFIG.date ??
      d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).replace(",", "");
  }
  tick();
  setInterval(tick, 1000);

  // ---- Screens: lock -> passcode -> home ----
  let state = "lock";
  function show(next) {
    state = next;
    phone.classList.toggle("passcode", next === "passcode");
    phone.classList.toggle("home", next === "home");
    if (next !== "passcode") clearCode();
  }

  // Swipe up on the lock screen (or down on the home screen) with mouse or touch.
  const lock = $("lockScreen");
  let drag = null;
  phone.addEventListener("pointerdown", e => {
    if (state === "passcode" || e.target.closest("[contenteditable], .btn, button")) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0 };
    if (state === "lock") lock.classList.add("dragging");
  });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.dy = e.clientY - drag.y;
    if (state === "lock") {
      const up = Math.min(0, drag.dy);
      lock.style.transform = `translateY(${up}px)`;
      lock.style.opacity = 1 + up / 400;
    }
  });
  window.addEventListener("pointerup", () => {
    if (!drag) return;
    const { dy, t } = drag;
    const fast = Math.abs(dy) / (performance.now() - t) > 0.5;
    drag = null;
    lock.classList.remove("dragging");
    lock.style.transform = lock.style.opacity = "";
    if (state === "lock" && (dy < -120 || (fast && dy < -30))) show("passcode");
    else if (state === "home" && (dy > 120 || (fast && dy > 30))) show("lock");
  });

  // Keypad
  const LETTERS = ["", "ABC", "DEF", "GHI", "JKL", "MNO", "PQRS", "TUV", "WXYZ"];
  $("keypad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `
    <button class="key${n === 0 ? " zero" : ""}" type="button" data-n="${n}">
      <b>${n}</b>${n ? `<small>${LETTERS[n - 1]}</small>` : ""}
    </button>`).join("");

  let code = "";
  const dots = [...$("dots").children];
  function render() {
    dots.forEach((d, i) => d.classList.toggle("on", i < code.length));
    $("cancelBtn").textContent = code ? "Delete" : "Cancel";
  }
  function clearCode() { code = ""; render(); }
  function press(n) {
    if (code.length >= 6) return;
    code += n;
    render();
    if (code.length < 6) return;
    setTimeout(() => {
      if (code === CONFIG.passcode) {
        show("home");
      } else {
        $("dots").classList.add("shake");
        navigator.vibrate?.(200);
        setTimeout(() => { $("dots").classList.remove("shake"); clearCode(); }, 450);
      }
    }, 120);
  }
  function flash(n) {
    const k = $("keypad").querySelector(`[data-n="${n}"]`);
    k.classList.add("pressed");
    setTimeout(() => k.classList.remove("pressed"), 120);
  }
  $("keypad").addEventListener("pointerdown", e => {
    const k = e.target.closest(".key");
    if (!k) return;
    flash(k.dataset.n);
    press(k.dataset.n);
  });
  $("cancelBtn").addEventListener("click", () => {
    if (code) { code = code.slice(0, -1); render(); }
    else show("lock");
  });

  window.addEventListener("keydown", e => {
    if (document.activeElement?.isContentEditable) return;
    if (state === "passcode") {
      if (/^\d$/.test(e.key)) { flash(e.key); press(e.key); }
      else if (e.key === "Backspace") $("cancelBtn").click();
      else if (e.key === "Escape") show("lock");
    } else if (state === "lock" && (e.key === "ArrowUp" || e.key === " " || e.key === "Enter")) {
      show("passcode");
    } else if (state === "home" && (e.key === "ArrowDown" || e.key === "Escape")) {
      show("lock");
    }
  });
</script>
</body>
</html>
