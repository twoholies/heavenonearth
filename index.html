<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hesa's Lock Screen</title>
<style>
  :root {
    --glass: rgba(110, 110, 118, 0.38);
    --glass-strong: rgba(240, 240, 245, 0.42);
    --text: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
    color: var(--text);
  }

  .phone {
    position: relative;
    width: min(402px, 100vw);
    aspect-ratio: 402 / 874;
    max-height: 100vh;
    overflow: hidden;
    background: #9fb0c2 center / cover no-repeat;
    border-radius: 0;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  @media (min-width: 500px) { .phone { border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,.6); } }

  /* status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0 52px; font-weight: 600; font-size: 16px;
  }
  .status .icons { display: flex; gap: 6px; align-items: center; }

  /* date + clock */
  .date {
    position: absolute; top: 84px; width: 100%; text-align: center;
    font-size: 20px; font-weight: 500; letter-spacing: .2px;
  }
  .clock {
    position: absolute; top: 108px; width: 100%; text-align: center;
    font-size: 104px; font-weight: 600; line-height: 1; letter-spacing: -2px;
    color: rgba(255,255,255,.88);
    font-family: "SF Pro Rounded", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  /* notifications */
  .notifs {
    position: absolute; left: 14px; right: 14px; bottom: 228px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .notif {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 22px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255,255,255,.35);
    text-shadow: none;
  }
  .avatar { position: relative; flex: none; width: 40px; height: 40px; }
  .avatar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .avatar .badge {
    position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px;
    border-radius: 5px; background: #25d366; display: grid; place-items: center;
    border: 1.5px solid rgba(255,255,255,.9);
  }
  .notif .body { flex: 1; min-width: 0; }
  .notif .row { display: flex; justify-content: space-between; align-items: baseline; }
  .notif .name { font-weight: 600; font-size: 15px; color: #fff; }
  .notif .when { font-size: 13px; color: rgba(255,255,255,.75); }
  .notif .msg { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* widgets */
  .widgets {
    position: absolute; left: 38px; right: 30px; bottom: 132px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .battery-widget { width: 154px; font-size: 15px; font-weight: 600; }
  .battery-widget .top { display: flex; align-items: center; gap: 6px; }
  .battery-widget .device { margin-top: 2px; font-weight: 500; }
  .battery-widget .bar { margin-top: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); overflow: hidden; }
  .battery-widget .bar span { display: block; height: 100%; background: #fff; border-radius: 3px; }
  .circles { display: flex; gap: 14px; }
  .circle {
    width: 58px; height: 58px; border-radius: 50%; position: relative;
    background: rgba(40,40,45,.35);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .circle svg.ring { position: absolute; inset: 0; }
  .circle .big { font-size: 22px; line-height: 1; }
  .circle .tiny { font-size: 9px; display: flex; gap: 10px; margin-top: 2px; }
  .circle .t { font-size: 15px; line-height: 1; }
  .circle .ampm { font-size: 9px; margin-top: 2px; }

  /* bottom buttons */
  .btn {
    position: absolute; bottom: 48px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(60,60,65,.35);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: grid; place-items: center;
  }
  .btn.left { left: 46px; } .btn.right { right: 46px; }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #fff;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status">
    <span id="carrier"></span>
    <span class="icons">
      <!-- signal -->
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <!-- wifi -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.1 3.6l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2a7 7 0 0 0-10 0l1.2 1.2c1-.9 2.3-1.5 3.8-1.5Zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6Z"/></svg>
      <!-- battery -->
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect id="sbBatt" x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4" width="1.8" height="5" rx="1" fill="#fff" fill-opacity=".5"/></svg>
    </span>
  </div>

  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>

  <div class="notifs" id="notifs"></div>

  <div class="widgets">
    <div class="battery-widget">
      <div class="top">
        <svg width="10" height="16" viewBox="0 0 10 16"><rect x="1" y="2" width="8" height="13" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3.5" y="0" width="3" height="2" rx=".5" fill="#fff"/><rect x="2.5" y="4" width="5" height="9.5" rx="1" fill="#fff"/></svg>
        <span id="battPct"></span>
      </div>
      <div class="device" id="device"></div>
      <div class="bar"><span id="battBar"></span></div>
    </div>
    <div class="circles">
      <div class="circle">
        <svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="4" stroke-dasharray="118 157" transform="rotate(135 29 29)" stroke-linecap="round"/><circle id="tempDot" cx="29" cy="4" r="3" fill="#fff"/></svg>
        <span class="big" id="temp"></span>
        <span class="tiny"><span id="tempLo"></span><span id="tempHi"></span></span>
      </div>
      <div class="circle">
        <svg width="14" height="10" viewBox="0 0 14 10" fill="#fff"><path d="M7 2a3.5 3.5 0 0 1 3.5 3.5H3.5A3.5 3.5 0 0 1 7 2Z"/><rect x="0" y="6.5" width="14" height="1.3" rx=".6"/><path d="M7 0v1M2.5 1.8l.7.7M11.5 1.8l-.7.7" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="t" id="sunset"></span>
        <span class="ampm" id="sunsetAmPm"></span>
      </div>
    </div>
  </div>

  <div class="btn left">
    <svg width="18" height="26" viewBox="0 0 18 26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M2 2h14v4l-3 4v13a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 5 23V10L2 6Z"/><path d="M2 6h14"/><circle cx="9" cy="15" r="1.4" fill="#fff"/></svg>
  </div>
  <div class="btn right">
    <svg width="26" height="20" viewBox="0 0 26 20" fill="#fff"><path d="M9 1h8l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4Z"/><circle cx="13" cy="11.5" r="5" fill="#555"/><circle cx="13" cy="11.5" r="3.6" fill="#fff"/></svg>
  </div>
  <div class="home-bar"></div>
</div>

<script>
  // ---- Edit everything here ----
  const CONFIG = {
    wallpaper: "download - 2026-10-29T181441.295.jpg",
    carrier: "TSEL",
    owner: "Hesa",
    battery: 92,
    // Set to e.g. "19:22" and "Thu Oct 29" for a fixed screenshot; null = live clock.
    time: null,
    date: null,
    weather: { temp: 67, lo: 50, hi: 78, sunset: "5:41", sunsetAmPm: "PM" },
    // Newest first, like iOS.
    notifications: [
      { name: "Isaac", avatar: "260116 #MARK 🐯 INSTAGRAM UPDATE.jpg", message: "Sorry for bothering you, Hesa", when: "now" },
      { name: "Niel",  avatar: "🐰.jpg", message: "Hi", when: "now" },
    ],
  };
  // ------------------------------

  const $ = id => document.getElementById(id);
  const src = f => encodeURIComponent(f);

  $("phone").style.backgroundImage = `url("${src(CONFIG.wallpaper)}")`;
  $("carrier").textContent = CONFIG.carrier;
  $("device").textContent = `${CONFIG.owner}'s iPhone`;
  $("battPct").textContent = `${CONFIG.battery}%`;
  $("battBar").style.width = `${CONFIG.battery}%`;
  $("sbBatt").setAttribute("width", (20 * CONFIG.battery / 100).toFixed(1));
  $("temp").textContent = CONFIG.weather.temp;
  $("tempLo").textContent = CONFIG.weather.lo;
  $("tempHi").textContent = CONFIG.weather.hi;
  $("sunset").textContent = CONFIG.weather.sunset;
  $("sunsetAmPm").textContent = CONFIG.weather.sunsetAmPm;

  // place the dot on the temperature gauge
  const w = CONFIG.weather, frac = Math.min(1, Math.max(0, (w.temp - w.lo) / (w.hi - w.lo)));
  const ang = (135 + frac * 270) * Math.PI / 180;
  $("tempDot").setAttribute("cx", 29 + 25 * Math.cos(ang));
  $("tempDot").setAttribute("cy", 29 + 25 * Math.sin(ang));

  const wa = `<svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>`;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  $("notifs").innerHTML = CONFIG.notifications.map(n => `
    <div class="notif">
      <div class="avatar"><img src="${src(n.avatar)}" alt=""><span class="badge">${wa}</span></div>
      <div class="body">
        <div class="row"><span class="name">${esc(n.name)}</span><span class="when">${esc(n.when)}</span></div>
        <div class="msg">${esc(n.message)}</div>
      </div>
    </div>`).join("");

  function tick() {
    const d = new Date();
    $("clock").textContent = CONFIG.time ??
      `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    $("date").textContent = CONFIG.date ??
      d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).replace(",", "");
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
